<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>اختيار الشعبة — دليل التوجيه الجامعي 2025</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f1ec;
        --surface: #ffffff;
        --text: #1a1a1a;
        --muted: #5c5c5c;
        --border: #e4ddd3;
        --accent: #0f4c5c;
        --accent-soft: #d7ecef;
        --shadow: 0 10px 30px rgba(15, 76, 92, 0.08);
        --radius: 16px;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html { touch-action: manipulation; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans Arabic", sans-serif;
        background: linear-gradient(180deg, #ebe4d8 0%, var(--bg) 220px);
        color: var(--text);
        line-height: 1.6;
      }
      .container {
        width: min(1200px, calc(100% - 2rem));
        margin-inline: auto;
      }
      .bac-selector {
        display: flex;
        align-items: center;
        min-height: 100vh;
        padding: calc(env(safe-area-inset-top) + 2rem) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 2rem) env(safe-area-inset-left);
      }
      .bac-selector h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.6rem, 3vw, 2.4rem);
        line-height: 1.25;
        text-align: center;
      }
      .bac-selector .subtitle {
        margin: 0 auto 2rem;
        color: var(--muted);
        max-width: 52ch;
        text-align: center;
      }
      .bac-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1rem;
      }
      .bac-card {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        font: inherit;
        font-size: 1.15rem;
        font-weight: 600;
        cursor: pointer;
        border: 2px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        text-decoration: none;
        transition: border-color 0.15s, box-shadow 0.15s;
        box-shadow: var(--shadow);
      }
      .bac-card:hover {
        border-color: var(--accent);
        box-shadow: 0 10px 30px rgba(15, 76, 92, 0.18);
      }
      .bac-card:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <section class="bac-selector">
      <div class="container">
        <h1>اختر شعبة البكالوريا</h1>
        <p class="subtitle">اختر شعبتك لاستعراض خيارات التوجيه الجامعي المتاحة</p>
        <div class="bac-grid">
          <a class="bac-card" href="index.html?bac=math">رياضيات</a>
          <a class="bac-card" href="index.html?bac=sci">علوم تجريبية</a>
          <a class="bac-card" href="index.html?bac=eco">اقتصاد وتصرف</a>
          <a class="bac-card" href="index.html?bac=let">آداب</a>
          <a class="bac-card" href="index.html?bac=info">علوم الإعلامية</a>
          <a class="bac-card" href="index.html?bac=tech">علوم التقنية</a>
          <a class="bac-card" href="index.html?bac=sp">رياضة</a>
        </div>
      </div>
    </section>
  </body>
</html>
