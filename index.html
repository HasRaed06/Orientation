<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>دليل التوجيه الجامعي 2025</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <div>
          <p class="eyebrow">دورة التوجيه الجامعي 2026</p>
          <h1 id="appTitle">خيارات التوجيه</h1>
          <p class="subtitle">
            جميع الخيارات المستخرجة من دليل طاقة الاستيعاب مع إمكانية التصفية حسب
            المجموع والقطاع.
          </p>
        </div>
        <div class="stats" id="stats"></div>
      </div>
    </header>

    <main class="container">
      <section class="filters card">
        <h2>تصفية النتائج</h2>
        <div class="filters-grid">
          <label class="field">
            <span>القطاع</span>
            <select id="categoryFilter">
              <option value="">كل القطاعات</option>
            </select>
          </label>

          <label class="field">
            <span>ترتيب حسب مجموع</span>
            <select id="sortOrder">
              <option value="">بدون ترتيب</option>
              <option value="asc">تصاعدي (من الأصغر إلى الأكبر)</option>
              <option value="desc">تنازلي (من الأكبر إلى الأصغر)</option>
            </select>
          </label>

          <label class="field">
            <span>قيمة المجموع</span>
            <input
              type="number"
              id="scoreValue"
              placeholder="مثال: 100"
              step="0.01"
              min="0"
              max="200"
            />
          </label>

          <label class="field">
            <span></span>
            <select id="scoreMode">
              <option value="lte" selected>أصغر من أو يساوي</option>
              <option value="gte">أكبر من أو يساوي</option>
            </select>
          </label>

          <label class="field field-wide">
            <span>بحث (مؤسسة، إجازة، تخصص...)</span>
            <input type="search" id="searchInput" placeholder="ابحث..." />
          </label>
        </div>
        <div class="filter-actions">
          <button type="button" class="btn btn-primary" id="filterBtn">تصفية</button>
          <button type="button" class="btn btn-ghost" id="resetBtn">إعادة الضبط</button>
          <a class="btn btn-back" href="bac-selector.html">تغيير الشعبة</a>
        </div>
      </section>

      <section class="results-header">
        <h2>الخيارات المتاحة</h2>
        <p id="resultsCount"></p>
      </section>

      <div id="results" class="results-grid"></div>
      <p id="emptyState" class="empty-state" hidden>لا توجد نتائج مطابقة للتصفية.</p>
    </main>

    <footer class="footer">
      <div class="container">
        <p>البيانات المستخرجة من دليل طاقة الاستيعاب 2026 — بكالوريا تونسية</p>
      </div>
    </footer>

    <button id="scrollToTopBtn" class="scroll-to-top" aria-label="العودة للأعلى">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5"/>
        <path d="M5 12l7-7 7 7"/>
      </svg>
    </button>
    <script type="module" src="/main.js"></script>
  </body>
</html>
